repos:
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # frozen: v2.4.1
  hooks:
  - id: mypy
    additional_dependencies:
    - types-docutils
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: end-of-file-fixer
    exclude: '\.gaphor'
  - id: check-yaml
    exclude: '.\.gaphor'
  - id: trailing-whitespace
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
  hooks:
  - id: shellcheck
    args: [--exclude, SC1017]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: '25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c'  # frozen: v0.17.3
  hooks:
  - id: ruff-check
    args: [--fix, --preview]
  - id: ruff-format
    types_or: [python, spec]
